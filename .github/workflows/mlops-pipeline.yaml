name: MLops PIpeline

on:
  workflow_dispatch:
    inputs:
      run_all:
        description: 'Run all jobs'
        type: boolean
        required: false
        default: true
      run_data_processing:
        description: 'Run data processing job'
        type: boolean
        required: false
        default: false
      run_model_trainning:
        description: 'Run model trainning job'
        type: boolean
        required: false
        default: false
      run_build_and_publish:
        description: 'Run build and publish job'
        type: boolean
        required: false
        default: false
  release:
    types: [created]
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  push:
    branches:
      - main
  pull_request:
    branches:
      - main  

jobs:
  data-processing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # Actualizado a v4

      - name: Set up Python
        uses: actions/setup-python@v5 # Cambiado de v7 a v5 (versión válida)
        with:
          python-version: '3.11.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

#      - name: Run tests # (O el siguiente paso que estabas escribiendo)
#        run: |
#          pytest

      - name: Run Data Processing
        run: |
          python src/data/run_processing.py \
            --input_path data/raw/house_data.csv \
            --output_path data/processed/cleaned_house_data.csv
      
      - name: Do Feature Engineering
        run: |
          python src/features/engineer.py \
            --input data/processed/cleaned_house_data.csv \
            --output data/processed/featured_house_data.csv \
            --preprocessor models/trained/preprocessor.pkl

      - name: Upload processed data
        uses: actions/upload-artifact@v4
        with:
          name: processed-data
          path: data/processed/featured_house_data.csv

      - name: Upload processed data
        uses: actions/upload-artifact@v4
        with:
          name: preprocessor
          path: models/trained/preprocessor.pkl

  model-trainning:
    needs: data-processing
    runs-on: ubuntu-latest
    steps:

      - name: Checkout code
        uses: actions/checkout@v4 # Actualizado a v4

      - name: Set up Python
        uses: actions/setup-python@v5 # Cambiado de v7 a v5 (versión válida)
        with:
          python-version: '3.11.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
    
      - name: Download processed data
        uses: actions/download-artifact@v4
        with:
          name: processed-data
          path: data/processed/

      - name: Setup MLFlow
        run: |
          docker pull ghcr.io/mlflow/mlflow:latest
          docker run -d -p 5555:5000 --name=mlflow-server ghcr.io/mlflow/mlflow:latest \
            mlflow server --host 0.0.0.0 \
            --backend-store-uri sqlite:///mlflow.db \
           --default-artifact-root /tmp/mlruns

      - name: Wait for MLFlow to be ready
        run: |
          echo "Waiting for MLFlow server to be ready..."
          until curl -s http://localhost:5555/health | grep "OK" > /dev/null; do
            sleep 5
          done
          echo "MLFlow server is ready."

      - name: Train the Model
        run: |
          python src/models/train_model.py \
            --config configs/model_config.yaml \
            --data data/processed/featured_house_data.csv \
            --models-dir models \
            --mlflow-tracking-uri http://localhost:5555

      - name: Upload trained model
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: models/

      - name: Cleanup MLFlow
        run: |
          docker stop mlflow-server
          docker rm mlflow-server
          docker rmi ghcr.io/mlflow/mlflow:latest

  build-and-publish:
    needs: model-trainning
    runs-on: ubuntu-latest
    steps:

      - name: Checkout code
        uses: actions/checkout@v4 # Actualizado a v4

      - name: Download trainned model
        uses: actions/download-artifact@v4
        with:
          name: trained-model
          path: models/
    
      - name: Download preprocessor
        uses: actions/download-artifact@v4
        with:
          name: preprocessor
          path: models/trained/

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build and test Docker image
        run: |
          COMMIT_HASH=$(echo ${{ github.sha }} | cut -c1-7)
          docker build -t docker.io/${{ vars.DOCKERHUB_USERNAME }}/house-price-model:${COMMIT_HASH} -f Dockerfile .
          docker run -d -p 8000:8000 --name test-api docker.io/${{ vars.DOCKERHUB_USERNAME }}/house-price-model:${COMMIT_HASH}
          for i in {1..10}; do
            curl -f http://localhost:8000/health || { echo "API not ready yet, retrying..."; sleep 5; }
          done
          docker stop test-api

      - name: Clean up Test Container
        run: |
          docker stop test-api || true
          docker rm test-api || true

      - name: Login DockerHub container Registry
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Push Docker image to Docker Hub
        run: |
          COMMIT_HASH=$(echo ${{ github.sha }} | cut -c1-7)
          docker tag docker.io/${{ vars.DOCKERHUB_USERNAME }}/house-price-model:${COMMIT_HASH} docker.io/${{ vars.DOCKERHUB_USERNAME }}/house-price-model:latest/house-price-model:latest
          docker push docker.io/${{ vars.DOCKERHUB_USERNAME }}/house-price-model:${COMMIT_HASH}
          docker push docker.io/${{ vars.DOCKERHUB_USERNAME }}/house-price-model:latest
